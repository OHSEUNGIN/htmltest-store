<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            margin:0;
        }
        .header {
            background-color: lightblue;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo img {
            height: 50px;
        }

        .menu {
            display: flex;
            gap: 30px;

            font-weight: bold;
        }

        .menu div:hover {
            color: orange;
        }

        .login-btn {
            background-color: orange;
            padding: 8px 18px;

            border-radius: 5px;

            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background-color: darkorange;
        }

        .main {
            display: flex;
        }

        .sidebar {
            background-color: lightyellow;
            width: 200px;
            height: 400px;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;

        }

        .side-item {
            background-color: orange;
            padding: 10px;
            cursor: pointer;

            transition: 0.2s;
        }

        .side-item:hover {
            background-color: darkorange;
        }

        .content {
            background-color: white;
            flex: 1;
            min-height: 400px;

            display: flex;
            flex-wrap: wrap;
            gap: 20px;

            padding: 20px;
            box-sizing: border-box;
            align-content: flex-start;
        }

        .card {
            width: 200px;
            height: 260px;
            border: 1px solid black;
            border-radius: 10px;

            overflow: visible;
            cursor: pointer;
            transition: 0.3s;

            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);

            display: flex;
            flex-direction: column;
        }

        .card:hover .badge {
            transform: rotate(-6deg) scale(1.06);           
        }
        .card:hover .product-img {
            transform: scale(1.1);
        } 

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .image {
            height: 140px;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: visible;
            background-color: #f5f5f5;
        }

        .image .product-img {
            max-width: 100%;
            max-height: 100%;
            display: block;
            transition: 0.3s;
        }





        .badge {
            position: absolute;
            top: -8px;
            left: -8px;

            width: 54px;

            /*background-color: red;*/
            color: white;
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 5px;
            z-index: 5;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));

            transition: 0.25s;

        }

      

        .title {
            padding: 10px 10px 5px 10px;
        }

        .price {
            padding: 0 10px;
            color: gray;
            font-size: 14px;
        }

        .button {
            margin-top: auto;
            background-color: orange;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;

            padding: 10px;
            cursor: pointer;

            transition: 0.2s;
        }

        .button img {
            width: 32px;
        }

        .button:hover {
            background-color: darkorange;
        }
        .button:hover img{
            transform: rotate(-15deg);
        }

        .footer {
            background-color: #222;
            padding: 20px;

            display: flex;
            flex-direction: column;
            gap: 8px;

            font-size: 14px;
            color: white;

        }
    </style>
</head>
